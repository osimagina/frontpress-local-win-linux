name: Release

# Builds FrontPress Local for Windows + Linux, signs the auto-updater
# artifacts, and publishes a GitHub Release + `latest.json` that the app's
# updater reads.
#
# Trigger by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
#
# ─────────────────────────────────────────────────────────────────────────────
# Required repository secrets
# ─────────────────────────────────────────────────────────────────────────────
# Updater signing (REQUIRED now — without these the app can't verify updates):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/frontpress-local.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key's password (empty string if none)

on:
  push:
    tags:
      - "v*"
  # Manual fallback: `gh workflow run release.yml --ref <tag>`. Runs against
  # the chosen tag ref, so GITHUB_REF stays `refs/tags/<tag>` and the
  # tagName/version below keep working unchanged.
  workflow_dispatch: {}

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 — NSIS .exe (+ updater artifacts).
          - os: windows-latest
            rust-targets: ""
            args: ""
          # Linux x64 — AppImage + .deb (+ updater artifacts).
          - os: ubuntu-22.04
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (verifies the update payload):
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Windows: default x64 NSIS. Linux: default x64 AppImage + deb.
          # tauri-action merges each platform into the same release + latest.json.
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "FrontPress Local ${{ github.ref_name }}"
          releaseBody: "See the assets below to download. The app auto-updates."
          releaseDraft: false
          prerelease: false
          # tauri-action generates latest.json (the updater manifest) and
          # attaches it to the release automatically.
